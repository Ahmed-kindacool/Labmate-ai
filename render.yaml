# Render Blueprint: New + > Blueprint > pick this repo. Only AI_API_KEY needs
# to be entered by hand (it is never stored in the repo).
services:
  - type: web
    name: labmate-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_API_KEY
        sync: false            # you type this in the Render dashboard
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      # Free instances have 512 MB RAM and ~0.1 CPU: one report at a time, and
      # generous timeouts because compiling/starting code is slow on a tiny CPU.
      - key: MAX_CONCURRENT_GENERATIONS
        value: "1"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: CODE_EXECUTION_TIMEOUT_SECONDS
        value: "15"
      - key: CODE_COMPILE_TIMEOUT_SECONDS
        value: "60"
