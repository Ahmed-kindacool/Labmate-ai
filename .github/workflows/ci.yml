name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import sanity check
        run: python -c "import app.main"
      - name: Tests (real local code execution; g++/gcc are on the runner)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t labmate .
      - name: Smoke test (health + UI served)
        run: |
          docker run -d --name labmate -p 8000:8000 -e AI_API_KEY=dummy labmate
          for i in $(seq 1 20); do curl -fs localhost:8000/api/v1/health && break || sleep 2; done
          curl -fs localhost:8000/ | grep -qi "<div id=\"root\""
          docker exec labmate python -c "import asyncio; from app.execution import get_executor; r=asyncio.run(get_executor('cpp').execute('#include <iostream>\nint main(){std::cout<<42;}')); print(r); assert r.stdout=='42'"
