name: Backend CI

# Backend-only: addresses the long-flagged "no pre-push safety check"
# item from PROJECT_HANDOFF.md / docs/PHASE9_TESTING.md. Runs the same
# commands documented there and in docs/PHASE9_TESTING.md, so a broken
# build (like the Phase 5 merge-conflict incident this project already
# hit once) fails in CI instead of only being caught by hand.
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Import sanity check
        # Catches a broken build immediately and separately from the test
        # run itself -- exactly the check that would have caught the
        # Phase 5 merge-conflict-markers-in-committed-code incident before
        # it was ever marked "Completed" in a commit message.
        run: python -c "import app.main"

      - name: Run tests with coverage
        # Docker and a real Chromium aren't available on the default
        # GitHub-hosted runner, so this runs exactly what every
        # contributor's machine runs without those -- the same
        # gracefully-degraded paths (UNSUPPORTED execution, mocked
        # screenshots) that are already covered without needing either.
        # SANDBOX_CHROMIUM_PATH and antiword-dependent tests stay skipped
        # here, same as they do locally without those installed.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
